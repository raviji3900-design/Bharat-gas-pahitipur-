<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle (Material 3 style) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />

  <!-- White ID Badge / Clipboard shape -->
  <g filter="url(#shadow)">
    <rect x="136" y="110" width="240" height="310" rx="28" fill="url(#cardGrad)" />
    
    <!-- Top badge clip -->
    <rect x="206" y="86" width="100" height="38" rx="12" fill="#065f46" />
    <circle cx="256" cy="105" r="8" fill="#ffffff" />
    
    <!-- User avatar icon inside badge -->
    <circle cx="256" cy="190" r="38" fill="#059669" />
    <path d="M196 268 C 196 230, 316 230, 316 268 Z" fill="#059669" />
    
    <!-- Attendance card lines -->
    <rect x="176" y="285" width="160" height="12" rx="6" fill="#cbd5e1" />
    <rect x="176" y="310" width="110" height="12" rx="6" fill="#e2e8f0" />
    
    <!-- Success Green Checkmark circle floating badge -->
    <circle cx="340" cy="370" r="46" fill="#10b981" stroke="#ffffff" stroke-width="6" />
    <path d="M322 370 L335 383 L360 356" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
